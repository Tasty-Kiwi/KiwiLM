[project]
name = "kiwilm"
version = "0.1.0"
description = "KiwiLM 2 hybrid language-model research toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=4.0",
    "huggingface-hub>=0.34",
    "numpy>=2.0",
    "safetensors>=0.5",
    "tokenizers>=0.23",
    "torch>=2.7",
    "tqdm>=4.67",
]

[project.scripts]
kiwilm = "kiwilm.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/kiwilm"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[project]
name = "kiwilm"
version = "0.1.0"
description = "Modular toy language models trained on TinyStories"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=4.0",
    "numpy>=2.0",
    "tokenizers>=0.21",
    "torch>=2.7",
    "tqdm>=4.67",
]

[project.scripts]
kiwilm = "kiwilm.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kiwilm"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

